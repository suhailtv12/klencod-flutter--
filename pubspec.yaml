name: flutter_app
description: A professional task manager and notes app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # دعم اللغة العربية واتجاه الشاشة (RTL)
  flutter_localizations:
    sdk: flutter

  # الحفظ المحلي للمذكرات والإعدادات (موجود في كودك الأصلي)
  shared_preferences: ^2.2.2

  # حماية المذكرات بقفل الجهاز (البصمة، النمط، ورمز المرور)
  local_auth: ^2.2.0

  # تحويل الصوت والكلام إلى نص داخل المذكرة
  speech_to_text: ^6.6.1

  # اختيار خلفيات وصور للمذكرات من استوديو الهاتف
  image_picker: ^1.1.2

  # ربط واستدعاء نتائج محرك بحث جوجل عبر API
  http: ^1.2.1

  # تنسيق التواريخ والوقت
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true